    <link rel="help" href="/connect.md" title="Enter with ChatGPT / Codex, Claude or another agent" />
    <style>
      /* Cover the first paint, before the app stylesheet or scripts arrive. */
      html,body{margin:0;background:#121212}
      #update-veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#121212;color:#ccc;font:12px Verdana,sans-serif}
      #update-veil[hidden]{display:none}
      body[data-loading]>:not(#update-veil):not(#load-error){visibility:hidden}
      body[data-loading] dialog::backdrop{visibility:hidden}
    </style>
  </head>
  <body data-loading aria-busy="true">
    <main id="scene" tabindex="0" role="application" aria-label="Click an empty floor tile to walk there. You can also use the arrow keys."></main>
    <div id="load-error" role="alert" hidden>We couldn’t open the room. Please try a browser with WebGL enabled.</div>
    <div id="update-veil" role="status">Getting the room ready…</div>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
