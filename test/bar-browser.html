<!doctype html><meta charset="utf-8"><title>Bar stool verification</title>
<style>body{margin:24px;background:#363b41;color:white;font:14px Verdana}#views{display:flex;gap:20px;flex-wrap:wrap}#views canvas{width:600px;height:500px;background:#929381;image-rendering:pixelated}section,dialog{display:none}</style>
<h1>Cocktail bar · three stools and drinks</h1><p id="result">Loading…</p><div id="views"></div>
<script type="module">
import {createFurniture} from '/src/furniture.js';
import {createAppearance} from '/src/appearance.js';
import {prepareImage} from '/src/sprite-image.js';
const look={hair:{model:'1',color:'#624631'},skin:{model:'1',color:'#e8b18a'},top:{model:'1',color:'#6b8c64'},bottom:{model:'1',color:'#55677e'},shoes:{model:'1',color:'#42454c'}};
const editor=await createAppearance({prepareImage,onApply(){},onOpen(){}});
const iso=(x,z)=>({x:(x-z)*32,y:(x+z)*16});
for(const rotation of [2,4]){
 const visuals=[],selected=[];
 const bar={id:'bar',type:'custom_bar',rotation,x:0,z:0};
 const furniture=await createFurniture({prepareImage,initialItems:[bar],worldPoint:iso,isTile:()=>true,getAvatar:()=>({x:8,z:8}),stopWalking(){},onChanged(){},onSit:seat=>selected.push(seat),focusRoom(){},markTiles(){},makeVisual(canvas){const mesh={canvas,material:{map:{}},scale:{setScalar(){}}};visuals.push(mesh);return mesh;},disposeVisual(){},positionVisual(mesh,x,y,w,h,renderOrder){Object.assign(mesh,{x,y,w,h,renderOrder});}});
 const layers=[...visuals],cells=furniture.seat('bar').cells;
 if(cells.length!==3)throw Error('Bar must have three stools');
 for(const [x,z] of cells){
  const seat=furniture.seat('bar',{x,z}),p=iso(x+.5,z+.5);
  furniture.pointer({x:p.x+seat.offsetX,y:p.y-38},{x,z},true);
  if(JSON.stringify(selected.at(-1)?.cells)!==JSON.stringify([[x,z]]))throw Error('Click must choose that specific stool');
  const avatar=await editor.previewFrame(look,seat.direction,-1,true,null,0,true);
  layers.push({canvas:avatar,x:p.x+seat.offsetX-48,y:p.y+seat.offsetY-101,w:96,h:112,renderOrder:300+(x+z)*10+9.5});
 }
 const canvas=document.createElement('canvas');canvas.width=360;canvas.height=300;
 const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
 for(const v of layers.sort((a,b)=>a.renderOrder-b.renderOrder))ctx.drawImage(v.canvas,v.x+165,v.y+100,v.w,v.h);
 const card=document.createElement('div'),label=document.createElement('p');label.textContent=`Rotation ${rotation} · all three stools occupied`;card.append(label,canvas);document.querySelector('#views').append(card);
}
document.querySelector('#result').textContent='PASS: each stool selects its own seat; three seated avatars hold drinks in both orientations.';
</script>
