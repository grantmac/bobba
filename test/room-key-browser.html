<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room key checks</title>
<link rel="stylesheet" href="/src/style.css">
<style>body{background:#343b32}#checks{position:absolute;left:16px;top:16px;color:white;font:12px Verdana,sans-serif}#checks button{margin:4px;padding:8px}#results{max-width:500px;line-height:1.6}</style>
<main id="scene" tabindex="0"></main><section id="checks"><button id="entry">Entry</button><button id="guest">Guest character</button><button id="saved">Saved character</button><button id="return">Returning visitor</button><p id="results">Ready. This preview uses simulated identity data.</p></section>
<script type="module">
import {createRoomKey} from '/src/room-key.js';
import {createAppearance} from '/src/appearance.js';
import {prepareImage} from '/src/sprite-image.js';
let saved=false,hasBackup=false,passkeyCount=0;
const results=document.querySelector('#results'),previewCode='12345678-12345678-12345678-12345678-12345678-12345678-12345678-12345678';
const identity={remembered:true,
  status:async()=>({saved,name:'Visitor',passkeys:passkeyCount,hasBackup,backupAvailable:true}),
  registrationOptions:async()=>{throw new DOMException('Cancelled by visitor','NotAllowedError');},
  authenticationOptions:async()=>{throw new DOMException('Cancelled by visitor','NotAllowedError');},
  makeBackup:async()=>{saved=true;hasBackup=true;results.textContent='PASS: new backup created. The displayed code is a preview, not a real credential.';return {code:previewCode};},
  useBackup:async code=>{if(code!==previewCode)throw new Error('That backup code is not valid or has already been used.');saved=true;hasBackup=false;results.textContent='PASS: original character restored; backup consumed.';return {token:'preview',player:{name:'Visitor'}};},
};
const previewLook={hair:{model:'1',color:'#624631'},skin:{model:'1',color:'#e8b18a'},top:{model:'1',color:'#6b8c64'},bottom:{model:'1',color:'#55677e'},shoes:{model:'1',color:'#42454c'}};
const key=createRoomKey({identity});
const editor=await createAppearance({prepareImage,onApply:async()=>{},onOpen(){},onRoomKey:()=>key.open()});
document.querySelector('#entry').onclick=()=>editor.enter({onCheckName:async()=>{},onEnter:async()=>{},agents:{key:async()=>({agentToken:'preview'}),attached:callback=>{callback([]);return ()=>{};}},onReturn:async()=>{const restored=await key.open('return');if(restored)results.textContent='PASS: returning character bypassed new-character entry.';return restored?{name:'Visitor',look:previewLook}:null;}});
document.querySelector('#guest').onclick=()=>{saved=false;editor.open();};
document.querySelector('#saved').onclick=()=>{saved=true;passkeyCount=1;key.open();};
document.querySelector('#return').onclick=()=>key.open('return');
key.open();
</script>
