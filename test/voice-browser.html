<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice chat verification</title><link rel="stylesheet" href="/src/style.css"><style>body{background:#222}#checks{position:fixed;top:20px;left:20px;color:#fff;font:13px Verdana;max-width:500px}#checks button{padding:8px;margin:5px}.voice-speaking{left:50%;top:50%}</style><div id="checks"><p>Isolated voice preview · simulated participants, no microphone capture.</p><p id="result">Loading…</p><button id="talk">Simulate visitor speaking</button><button id="reconnect">Simulate reconnect</button></div>
<script type="module">
import {createVoice} from '/src/voice.js';import {createToolbar} from '/src/toolbar.js';import {RoomEvent,Track} from 'livekit-client';
let calls=0,active,deferred=null;
class Room{
 constructor(){active=this;this.events=new Map();this.canPlaybackAudio=true;this.activeSpeakers=[];this.localParticipant={identity:'me',isMicrophoneEnabled:false,setMicrophoneEnabled:async value=>{calls++;this.localParticipant.isMicrophoneEnabled=value;}};this.visitor={identity:'other',isMicrophoneEnabled:true,setVolume:value=>{this.volume=value;}};this.remoteParticipants=new Map([['other',this.visitor]]);}
 on(name,fn){this.events.set(name,[...(this.events.get(name)||[]),fn]);return this;}
 emit(name,...args){for(const fn of this.events.get(name)||[])fn(...args);}
 async connect(){if(this.localParticipant.isMicrophoneEnabled)throw Error('Microphone started during join');}
 async startAudio(){}
 async disconnect(){this.localParticipant.isMicrophoneEnabled=false;this.emit(RoomEvent.Disconnected);}
}
const toolbar=createToolbar({admin:true,onVoice:()=>voice.open(),onRoomEdit(){},onFurniture(){},onChat(){}});
toolbar.setAdmin(false);
if([...document.querySelectorAll('.bar-icons>button')].filter(button=>!button.hidden).some(button=>!button.classList.contains('voice-toggle')))throw Error('Guests must only see the voice icon');
toolbar.setAdmin(true);
const voice=createVoice({credentials:()=>deferred??Promise.resolve({url:'wss://fixture.invalid',token:'fixture'}),loadSDK:async()=>({Room,RoomEvent,Track}),onState:state=>toolbar.setVoiceState(state)});
voice.syncPlayers([{id:'me',name:'Grant'},{id:'other',name:'Visitor'}]);toolbar.setVoiceEnabled(true);voice.open();
const click=selector=>document.querySelector(selector).click();
const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
click('[data-voice=join]');await tick();
if(calls!==0||document.querySelector('[data-voice=mic]').textContent!=='Turn mic on')throw Error('Join must stay muted');
click('[data-voice=mic]');await tick();if(!active.localParticipant.isMicrophoneEnabled)throw Error('Mic did not enable');
click('[aria-label="Mute Visitor for me"]');if(active.volume!==0)throw Error('Local mute failed');
click('[aria-label="Unmute Visitor for me"]');if(active.volume!==1)throw Error('Local unmute failed');
click('[data-voice=leave]');await tick();if(active.localParticipant.isMicrophoneEnabled)throw Error('Microphone remains active after leave');
click('[data-voice=join]');await tick();if(active.localParticipant.isMicrophoneEnabled)throw Error('Rejoin started microphone');
click('[data-voice=leave]');await tick();
let resolveCredentials;deferred=new Promise(resolve=>{resolveCredentials=resolve;});const previous=active;
click('[data-voice=join]');click('[data-voice=leave]');resolveCredentials({url:'wss://fixture.invalid',token:'fixture'});await tick();
if(active!==previous||document.querySelector('[data-voice=join]').hidden)throw Error('Cancelled join completed late');
const realSetTimeout=window.setTimeout;let expireJoin;
window.setTimeout=(callback,delay,...args)=>{if(delay===25000){expireJoin=callback;return 0;}return realSetTimeout(callback,delay,...args);};
deferred=new Promise(resolve=>{resolveCredentials=resolve;});click('[data-voice=join]');expireJoin();
window.setTimeout=realSetTimeout;
if(!document.querySelector('.voice-status').textContent.includes('Chrome')||document.querySelector('[data-voice=join]').disabled)throw Error('Timed-out join did not recover');
resolveCredentials({url:'wss://fixture.invalid',token:'fixture'});await tick();
if(active!==previous)throw Error('Timed-out credentials connected late');
deferred=null;click('[data-voice=join]');await tick();
active.emit(RoomEvent.ActiveSpeakersChanged,[active.visitor]);voice.positionSpeaker('other',150,200);
if(document.querySelectorAll('.voice-speaking').length!==1||document.querySelector('.voice-speaking').style.left!=='150px')throw Error('Speaker indicator did not follow visitor');
active.emit(RoomEvent.ActiveSpeakersChanged,[]);if(document.querySelector('.voice-speaking'))throw Error('Indicator remained during silence');
click('[data-voice=mic]');await tick();active.emit(RoomEvent.ActiveSpeakersChanged,[active.localParticipant]);
if(document.querySelectorAll('.voice-speaking').length!==1)throw Error('Own speaking indicator missing');
click('[data-voice=mic]');await tick();active.emit(RoomEvent.TrackMuted);
if(document.querySelector('.voice-speaking'))throw Error('Muted speaker kept an indicator');
document.querySelector('#result').textContent='PASS: guest toolbar, muted join, mic and mute controls, cleanup, cancellation, connection timeout and speaking-only avatar indicators.';
document.querySelector('#talk').onclick=()=>{active.activeSpeakers=active.activeSpeakers.length?[]:[active.visitor];active.emit(RoomEvent.ActiveSpeakersChanged,active.activeSpeakers);voice.positionSpeaker('other',innerWidth/2,innerHeight/2);};
document.querySelector('#reconnect').onclick=()=>{active.emit(RoomEvent.Reconnecting);setTimeout(()=>active.emit(RoomEvent.Reconnected),1200);};
</script>
