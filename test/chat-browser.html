<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speech bubble positioning</title>
<link rel="stylesheet" href="/src/style.css">
<style>
body{background:#333;color:#eee}#checks{padding:16px;font:12px/1.6 Verdana,sans-serif}#checks button{margin:8px;padding:8px;color:#222}
.head{position:absolute;width:16px;height:38px;border-radius:8px 8px 2px 2px;transform:translateX(-50%);background:#6b8c64;pointer-events:none}.head:after{content:attr(data-name);position:absolute;top:44px;left:50%;transform:translateX(-50%);font:11px Verdana,sans-serif}
</style>
<div id="checks"><p id="result">Checking speech bubble positioning…</p><button id="pan">Pan and zoom demo</button><button id="message">Add message</button></div>
<script type="module">
import {createChat} from '/src/chat.js';
const assert=(ok,message)=>{if(!ok)throw Error(message);},near=(a,b)=>Math.abs(a-b)<1;
const layout={x:innerWidth/2,y:innerHeight*.62,scale:1};
const speaker={id:'grant',name:'Grant',color:'#6b8c64',x:0,y:0};let selected=null;
const head=s=>({x:layout.x+s.x*layout.scale,y:layout.y+s.y*layout.scale});
const chat=createChat({getSpeaker:()=>speaker,getSpeakerPosition:head,onSelectSpeaker:s=>selected=s});
const boxes=()=>[...document.querySelectorAll('.chat-bubble:not([hidden])')];
const newest=()=>[...document.querySelectorAll('.chat-bubble')].at(-1);
const rect=el=>el.getBoundingClientRect();
const settle=()=>new Promise(resolve=>setTimeout(resolve,40));
const clear=()=>{for(let i=1;i<=8;i++)chat.update(performance.now()+i*5000);};
function noOverlap(){
  const all=boxes().map(rect);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j];
    assert(a.right+7.9<=b.left||b.right+7.9<=a.left||a.bottom+7.9<=b.top||b.bottom+7.9<=a.top,'Nearby bubbles must not overlap');
  }
}
function atHead(el,s){const r=rect(el),p=head(s);assert(near(r.x+r.width/2,p.x)&&near(r.bottom,p.y-8),'Newest bubble must sit directly above its speaker');}
try{
  chat.say('yooooo');await settle();atHead(newest(),speaker);
  const before=rect(newest());layout.x+=20;layout.y+=30;chat.update(performance.now());
  const after=rect(newest());assert(near(after.x-before.x,20)&&near(after.y-before.y,30),'Panning must move the bubble with the speaker');
  speaker.x=15;speaker.y=20;chat.update(performance.now());atHead(newest(),speaker);
  layout.scale=1.5;chat.update(performance.now());atHead(newest(),speaker);
  assert(near(rect(newest()).width,before.width)&&near(rect(newest()).height,before.height),'Zoom must preserve readable text size');
  speaker.y+=18;chat.update(performance.now());atHead(newest(),speaker);
  newest().click();assert(selected===speaker,'Clicking must select the right speaker');
  chat.update(performance.now()+5000);atHead(newest(),speaker);
  clear();speaker.x=0;speaker.y=0;layout.x=innerWidth/2;layout.y=innerHeight*.62;layout.scale=1;
  const other={id:'tnarg',name:'Tnarg',color:'#6484b8',x:0,y:-30};
  chat.say('Grant! Back again — the lounge missed you. 🎉','Say',other);
  chat.say('yooooo');noOverlap();atHead(newest(),speaker);
  const wide=innerWidth>700;
  other.x=wide?-200:-30;speaker.x=wide?200:30;chat.update(performance.now());noOverlap();
  if(wide){atHead(boxes()[0],other);atHead(newest(),speaker);assert(rect(boxes()[0]).right<rect(newest()).left,'Distant speakers must have separate bubble stacks');}
  clear();speaker.x=0;
  const long='Ha, “bla bla” — the classic admin greeting. 😊 Anything on your mind, Grant? '.repeat(4);
  chat.say(long);assert(newest().textContent===speaker.name+': '+long.trim(),'All wrapped text must be retained');
  assert(rect(newest()).width<=260&&rect(newest()).height>24,'Long messages must wrap');
  for(let i=0;i<8;i++)chat.say(long);noOverlap();
  assert(document.querySelectorAll('.chat-bubble').length===7,'Keep at most seven messages');
  assert(boxes().every(el=>rect(el).top>=6),'Older messages that cannot fit must not cover the newest message');
  assert(!newest().hidden,'Newest message must stay visible');
  clear();assert(!newest(),'Idle messages must expire');
  for(const p of [{x:-100000,y:-100000},{x:100000,y:100000}]){
    const far={...speaker,...p};chat.say('Hello from the far end of the map','Say',far);noOverlap();
    const r=rect(newest());assert(r.left>=5.9&&r.right<=innerWidth-5.9&&r.top>=5.9&&r.bottom<=innerHeight-54,'Offscreen messages must stay readable at the viewport edge');
    newest().click();assert(selected===far,'Offscreen messages must retain the speaker');clear();
  }
  chat.say('x'.repeat(400),'Say',{...speaker,name:'N'.repeat(80)});
  assert(newest().scrollWidth<=newest().clientWidth,'Long words and names must not overflow');clear();
  chat.say('<img src=x onerror=alert(1)>','Shout',{...speaker,name:'<b>Someone</b>'});
  assert(!newest().querySelector('img,b')&&newest().dataset.mode==='Shout','Safe literal text and speech mode must be retained');clear();
  chat.say('Visible above the keyboard');const stream=document.querySelector('.chat-stream');
  stream.style.height='240px';stream.style.top='40px';await settle();
  const r=rect(newest());assert(r.top>=46&&r.bottom<=272,'Keyboard viewport and offset must keep the newest message visible');
  stream.style.height='';stream.style.top='';await settle();clear();
  chat.say('Near the left edge','Say',{...speaker,x:-innerWidth/2+12});
  const tail=parseFloat(newest().style.getPropertyValue('--chat-tail'));
  assert(tail<rect(newest()).width/2,'A clamped bubble tail must still point towards its speaker');clear();
  chat.typing('preview','Preview',true,100,150);assert(document.querySelector('.typing-bubble'),'Typing indicator must appear');
  chat.removeTyping('preview');assert(!document.querySelector('.typing-bubble'),'Typing indicator must clear');
  document.querySelector('#result').textContent='PASS: speaker anchoring, movement, pan, zoom, separate speakers, collisions, viewport edges, keyboard, wrapping and expiry.';
  window.__chatTest='passed';
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.message;window.__chatTest='failed';throw error;}
clear();layout.x=innerWidth/2;layout.y=innerHeight*.62;layout.scale=1;speaker.x=Math.min(140,innerWidth*.15);speaker.y=40;
const other={id:'tnarg',name:'Tnarg',color:'#6484b8',x:-Math.min(140,innerWidth*.15),y:-60};
const markers=[speaker,other].map(s=>{const el=document.createElement('div');el.className='head';el.dataset.name=s.name;el.style.background=s.color;document.body.append(el);return {s,el};});
function update(){chat.update(performance.now());for(const {s,el} of markers){const p=head(s);el.style.left=p.x+'px';el.style.top=p.y+'px';}}
chat.say('Grant! Back again — the lounge missed you. 🎉','Say',other);chat.say('yooooo');update();
document.querySelector('#message').onclick=()=>{chat.say('Another message above my character');update();};
document.querySelector('#pan').onclick=()=>{const start=performance.now(),x=layout.x,y=layout.y;function animate(now){const t=Math.min(1,(now-start)/2400);layout.x=x+Math.sin(t*Math.PI*2)*30;layout.y=y+Math.sin(t*Math.PI*4)*30;layout.scale=1+Math.sin(t*Math.PI*2)*.25;update();if(t<1)requestAnimationFrame(animate);}requestAnimationFrame(animate);};
</script>
