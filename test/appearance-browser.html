<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appearance switch preview</title>
<link rel="stylesheet" href="/src/style.css"><main id="scene" tabindex="0"><button id="edit-look">Edit appearance</button></main>
<script type="module">
import {createAppearance} from '/src/appearance.js';import {prepareImage} from '/src/sprite-image.js';
const editor=await createAppearance({prepareImage,onApply:async()=>{},onOpen(){}});
document.querySelector('#edit-look').onclick=()=>editor.open();
editor.enter({
  onCheckName:async name=>{
    if(!/^[A-Za-z][A-Za-z0-9 _-]{1,19}$/.test(name.trim()))throw new Error('Use 2–20 characters, starting with a letter.');
    if(name.trim().toLowerCase()==='grant')throw new Error('That name is reserved. Please choose another name.');
  },
  onEnter:async()=>{},
  agents:{key:async()=>({agentToken:'preview-only'}),attached:callback=>{callback([]);return ()=>{};}}
});
</script>
