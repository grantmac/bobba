<!doctype html><meta charset="utf-8"><title>Deployment refresh verification</title><h1 id="build"></h1><p id="result"></p><label>Unsent chat draft <input id="draft"></label><button id="deploy">Simulate deployment</button><button id="check">Check for update</button>
<script type="module">
import {installAutoUpdate,saveUpdateSession,takeUpdateSession} from '/src/auto-update.js';
const version=new URLSearchParams(location.search).get('build')??'first',latestKey='fixture-release';
const state=takeUpdateSession('fixture');document.querySelector('#build').textContent=`Running build: ${version}`;
document.querySelector('#result').textContent=state?'PASS: automatic refresh restored the same player’s music settings.':'Type a draft, simulate deployment, then clear the draft to allow the update.';
if(state&&(state.music.volume!==.2||!state.music.muted))throw Error('Reload settings lost');
const updater=installAutoUpdate({version,fetchVersion:async()=>sessionStorage.getItem(latestKey)??version,canReload:()=>!document.querySelector('#draft').value,visible:()=>true,interval:5000,
 beforeReload:()=>saveUpdateSession({playerId:'fixture',music:{volume:.2,muted:true}}),
 reload:()=>location.replace(location.pathname+'?build='+sessionStorage.getItem(latestKey))});
document.querySelector('#deploy').onclick=()=>{sessionStorage.setItem(latestKey,version==='first'?'second':'first');void updater.check();};document.querySelector('#check').onclick=()=>updater.check();
window.addEventListener('pagehide',updater.stop);
</script>
