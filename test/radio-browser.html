<!doctype html><meta charset="utf-8"><title>Room radio verification</title><h1>Poolsuite live radio</h1><button id="start">Start decks</button><button id="stop">Stop decks</button><button id="mute">Mute locally</button><p id="status">Off</p><audio id="audio" controls></audio>
<script type="module">
import {createRoomRadio} from '/src/room-radio.js';
const audio=document.querySelector('audio'),radio=createRoomRadio({audio,onState:state=>document.querySelector('#status').textContent=JSON.stringify(state)});
document.querySelector('#start').onclick=()=>radio.receive([{type:'custom_dj_decks',x:0,z:0}],true);
document.querySelector('#stop').onclick=()=>radio.receive([],true);
document.querySelector('#mute').onclick=()=>radio.setMuted(true);
window.addEventListener('pagehide',()=>radio.close());
</script>
