<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tnarg dance comparison</title><style>
body{background:#292b32;color:#fff;font:14px monospace;margin:28px}main{display:grid;grid-template-columns:repeat(4,192px);gap:12px}figure{margin:0;background:#3d414b;text-align:center}canvas{width:192px;height:224px;image-rendering:pixelated}figcaption{padding:8px}button{margin:0 8px 20px 0;padding:8px}dialog{display:none}
</style></head><body><h1>Tnarg · dance comparison</h1><p>Robot and regular avatars share the same beat. Pause to inspect each pose.</p><button id="pause">Pause</button><button id="next">Next frame</button><span id="frame"></span><main></main><script type="module">
import {robotFrames} from '/src/robot-avatar.js';
import {createAppearance} from '/src/appearance.js';
import {prepareImage} from '/src/sprite-image.js';
const [robot,appearance]=await Promise.all([robotFrames(),createAppearance({prepareImage})]);
const main=document.querySelector('main'),previews=[];
for(const pose of ['dance','breakdance','idle','walk','wave','sit'])for(const kind of ['Robot','Regular'])for(const direction of [2,4,6,0]){
  if(kind==='Regular'&&!['dance','breakdance'].includes(pose))continue;
  const figure=document.createElement('figure'),canvas=document.createElement('canvas');canvas.width=96;canvas.height=112;
  const caption=document.createElement('figcaption');caption.textContent=`${kind} · ${pose} · ${direction}`;
  figure.append(canvas,caption);main.append(figure);previews.push({pose,direction,frames:kind==='Robot'?robot:appearance.initial,ctx:canvas.getContext('2d')});
}
let paused=false,elapsed=0,breakElapsed=0,last=0;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause';};
document.querySelector('#next').onclick=()=>{paused=true;document.querySelector('#pause').textContent='Play';elapsed+=180;breakElapsed+=130;};
function draw(time){
  if(!paused){const delta=last?time-last:0;elapsed+=delta;breakElapsed+=delta;}last=time;
  for(const {pose,direction,frames,ctx} of previews){
    const step=Math.floor(pose==='breakdance'?breakElapsed/130:elapsed/180);
    const key=pose==='idle'?`${direction}:-1`:pose==='sit'?`${direction}:sit`:pose==='walk'?`${direction}:${step%4}`:`${direction}:${pose}:${step%(pose==='dance'?8:pose==='breakdance'?16:2)}`;
    ctx.clearRect(0,0,96,112);ctx.drawImage(frames.get(key),0,0);
  }
  document.querySelector('#frame').textContent=`Dance ${Math.floor(elapsed/180)%8+1}/8 · Breakdance ${Math.floor(breakElapsed/130)%16+1}/16`;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
window.__ROBOT_FRAMES__=robot;
document.body.dataset.ready='true';
</script></body></html>
